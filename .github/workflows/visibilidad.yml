# Motor de visibilidad por API (capa 2): radar de citas en IA + respuestas de foro y refuerzos de página,
# redactados por Sonnet y revisados por Opus (puerta 5), pagados con los créditos de API del plan.
# Escribe en la rama datos-motor, carpeta motor/visibilidad/ (INDICE.md, radar.csv, investigar.md, listo/, apartado/).
# Nada sale a terceros desde aquí: lo de listo/ lo publica la pasada de Claude.
# Tope diario en el propio script (AVANZA_TOPE_TOKENS / AVANZA_TOPE_BUSQUEDAS).
# A mano: gh workflow run visibilidad.yml -f tarea=radar|foro|refuerzo|todo
name: Motor de visibilidad
on:
  schedule:
    - cron: "37 */2 * * *"   # cada dos horas, día y noche (14/11); el aviso de gasto del script baja el tope si el crédito no llega al 15/12
  workflow_dispatch:
    inputs:
      tarea:
        description: "auto (radar + foro o refuerzo, alternando), radar, foro, refuerzo o todo"
        required: false
        default: "auto"
permissions:
  contents: write   # solo para escribir en la rama datos-motor
concurrency:
  group: motor-visibilidad
  cancel-in-progress: false
jobs:
  visibilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Rama datos-motor
        run: |
          git config --global user.name "motor-visibilidad"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin datos-motor:datos-motor
          git worktree add datos datos-motor
          mkdir -p datos/motor/visibilidad
      - name: Visibilidad
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AVANZA_TOPE_TOKENS: "1500000"   # tope diario (14/11); PROVISIONAL: ~4,8 US$ por ~300.000 tokens (consola, 13/11)
          AVANZA_TOPE_MINIMO: "100000"    # si la proyección (estimada) al 15/12 pasa del crédito: tope = crédito restante / días, con este mínimo
          AVANZA_CREDITO_USD: "200"
          AVANZA_USD_POR_MTOK: "16"
          AVANZA_AVISO_FICHERO: ${{ runner.temp }}/aviso-gasto.txt
          TAREA: ${{ github.event.inputs.tarea || 'auto' }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "push" ]; then
            # prueba al subir el motor: una consulta de radar y un intento de foro, en una carpeta aparte
            AVANZA_RADAR_N=1 python3 .github/motor/visibilidad.py --datos datos/motor/visibilidad-prueba --tarea todo
          else
            case "$TAREA" in auto|radar|foro|refuerzo|todo) ;; *) echo "::error::tarea no válida"; exit 1;; esac
            python3 .github/motor/visibilidad.py --datos datos/motor/visibilidad --tarea "$TAREA"
          fi
      - name: Guardar
        id: guardar
        if: always()
        run: |
          cd datos
          # urgente.md y web.json los reaplica el paso siguiente sobre la versión remota: aquí se restauran
          for f in motor/urgente.md motor/web.json; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              if ! git diff --quiet -- "$f"; then echo "Se descartan los cambios locales de $f (los reaplica «Aviso de gasto»)"; fi
              git checkout -q -- "$f"
            elif [ -e "$f" ]; then
              echo "Se descarta $f, que no está en la rama"; rm -f -- "$f"
            fi
          done
          # Solo lo del motor de visibilidad (estado.json lleva el contador del tope); urgente.md y web.json, en el paso siguiente
          for d in motor/visibilidad motor/visibilidad-prueba; do [ -d "$d" ] && git add -A "$d"; done; true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -qm "visibilidad: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin datos-motor && exit 0
          for i in 1 2 3 4; do
            sleep $((i * 5))
            git pull -q --rebase origin datos-motor || { git rebase --abort; exit 1; }
            git push -q origin datos-motor && exit 0
          done
          echo "::error::No se pudo guardar en datos-motor: el gasto de hoy no queda anotado"
          exit 1
      - name: Aviso de gasto
        # Mejor esfuerzo: vigia.yml reescribe urgente.md y web.json cada hora; si choca, se parte de la versión remota
        # y se reaplica solo la línea del aviso. Nunca hace fallar el flujo ni toca lo ya guardado.
        if: always() && steps.guardar.outcome == 'success'
        continue-on-error: true
        env:
          AVISO: ${{ runner.temp }}/aviso-gasto.txt
        run: |
          [ -f "$AVISO" ] || { echo "Sin aviso de gasto"; exit 0; }
          cd datos
          for i in 1 2 3 4 5; do
            git fetch -q origin datos-motor && git reset -q --hard origin/datos-motor || { sleep $((i * 5)); continue; }
            (cd .. && python3 .github/motor/visibilidad.py --datos datos/motor/visibilidad --aplica-aviso "$AVISO")
            git add motor/urgente.md motor/web.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "Aviso ya anotado"; exit 0; fi
            git commit -qm "visibilidad: aviso de gasto $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin datos-motor && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Aviso de gasto no guardado en datos-motor (el tope reducido sí se aplicó)"
          exit 0
