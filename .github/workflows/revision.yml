# Puerta 5 por sello (22/11/2026, decisión de COMO FUNCIONAR): sin llamar a la API de Claude ni gastar créditos.
# La revisión de otro modelo la hace ChatGPT por REVISIONES, en el ordenador del despacho. Aquí se comprueba que la
# rama que cambia páginas acaba en un sello que cita ese REPASO con dictamen favorable, 0 NO y la huella de los
# ficheros que la rama cambia (.github/motor/repaso_sello.py). Sin REPASO, con dictamen NO o con la huella de otro
# contenido, queda en rojo. Una rama que no cambia páginas sale bien sin pedir nada.
# Corre en cada subida a una rama (también la del sello, que no cambia ficheros: por eso no hay filtro de rutas)
# y al abrir el PR. El revisor por API (.github/motor/revisor.py) sigue en el repositorio, sin uso.
name: Revisión puerta 5
on:
  push:
    branches-ignore: [main, "motor/**"]
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # En un PR, la cabeza de la rama y no el commit de fusión de prueba: el sello es el último commit de la rama.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Sello con REPASO de ChatGPT
        run: python3 .github/motor/repaso_sello.py comprobar --base origin/main
      - name: Salud de la rama (solo repositorio)
        if: always()
        run: python3 .github/motor/salud.py
