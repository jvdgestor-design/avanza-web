# Vigilancia diaria del BOE: si una norma citada en la web se actualiza, sale en rojo y dice qué páginas revisar.
# Sigue en rojo hasta que se marca como revisada: gh workflow run boe.yml -f revisado="Ley 35/2006"
name: Vigilancia del BOE
on:
  schedule:
    - cron: "41 4 * * *"   # 06:41 en Madrid en horario de verano, 05:41 en invierno
  workflow_dispatch:
    inputs:
      revisado:
        description: "Normas ya revisadas tras su cambio (nombre o BOE-A), separadas por ; (todo = todas)"
        required: false
        default: ""
      inicial:
        description: "Primera ejecución sin estado anterior (true)"
        required: false
        default: "false"
      pendientes_desde:
        description: "AAAAMMDD: normas actualizadas desde esa fecha quedan en rojo hasta revisarlas"
        required: false
        default: ""
  push:
    branches: [main, "motor/**"]
    paths:
      - ".github/motor/boe.py"
      - ".github/workflows/boe.yml"
permissions:
  contents: read
jobs:
  boe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Estado de la ejecución anterior
        uses: actions/cache/restore@v4
        with:
          path: boe-estado.json
          key: boe-estado-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: boe-estado-
      - name: Normas citadas contra el BOE
        env:
          REVISADO: ${{ github.event.inputs.revisado }}
          INICIAL: ${{ github.event.inputs.inicial }}
          PENDIENTES: ${{ github.event.inputs.pendientes_desde }}
        run: |
          EXTRA=""
          if [ "$INICIAL" = "true" ]; then EXTRA="--inicial"; fi
          if [ -n "$PENDIENTES" ]; then EXTRA="$EXTRA --pendientes-desde $PENDIENTES"; fi
          python3 .github/motor/boe.py --estado boe-estado.json --revisado "$REVISADO" $EXTRA
      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: boe-estado.json
          key: boe-estado-${{ github.run_id }}-${{ github.run_attempt }}
