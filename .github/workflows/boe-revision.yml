# Revisión de fondo contra el BOE (créditos de API, sin usos de Claude): para cada norma que la «Vigilancia
# del BOE» da por actualizada, lee los artículos citados en el consolidado vigente y pide a Claude qué
# afirmación de las páginas ya no casa. Informe en las anotaciones de cada trabajo.
# A mano: gh workflow run boe-revision.yml --ref main -f normas="LIVA;Ley 13/1997"  (vacío = las pendientes)
name: Revisión contra el BOE
on:
  workflow_dispatch:
    inputs:
      normas:
        description: "Normas separadas por ; (sigla, «Ley 37/1992», «RDL 29/2026» o BOE-A). Vacío = las pendientes de la última vigilancia"
        required: false
        default: ""
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  prepara:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      normas: ${{ steps.lista.outputs.normas }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Lista de normas
        id: lista
        env:
          GH_TOKEN: ${{ github.token }}
          NORMAS: ${{ github.event.inputs.normas }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys
          sys.path.insert(0, ".github/motor")
          from vigia import normas_boe_pendientes

          MAXIMO = 14
          normas = [n.strip() for n in os.environ.get("NORMAS", "").split(";") if n.strip()]
          if not normas:
              def gh(*a):
                  r = subprocess.run(["gh", "api", *a], capture_output=True, text=True)
                  if r.returncode:
                      print(f"::error::gh api {a[0]}: {r.stderr.strip()[:300]}")
                      sys.exit(1)
                  return r.stdout
              repo = os.environ["REPO"]
              runs = json.loads(gh(f"repos/{repo}/actions/workflows/boe.yml/runs?branch=main&status=completed&per_page=10"))
              run = next((r for r in runs.get("workflow_runs", [])
                          if r.get("head_branch") == "main" and r.get("conclusion") in ("success", "failure")), None)
              if run is None:
                  print("::error::No hay ninguna ejecución válida de la Vigilancia del BOE en main")
                  sys.exit(1)
              anotaciones = []
              for job in json.loads(gh(f"repos/{repo}/actions/runs/{run['id']}/jobs"))["jobs"]:
                  anotaciones.extend(json.loads(gh(f"repos/{repo}/check-runs/{job['id']}/annotations?per_page=100")))
              try:
                  pendientes, completa = normas_boe_pendientes(anotaciones)
              except RuntimeError as exc:
                  print(f"::error::{exc}")
                  sys.exit(1)
              normas = list(pendientes)
              print(f"Vigilancia {run['id']} ({run['conclusion']}): pendientes {normas or 'ninguna'}")
              if not normas and (run["conclusion"] == "failure" or not completa):
                  print("::error::La vigilancia no permite confirmar las normas pendientes. Revisar sus anotaciones.")
                  sys.exit(1)
          normas = list(dict.fromkeys(normas))
          if len(normas) > MAXIMO:
              print(f"::error::{len(normas)} normas: más de {MAXIMO} por ejecución (tope de gasto). Lanzar en tandas con -f normas=...")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("normas=" + json.dumps(normas, ensure_ascii=False) + "\n")
          EOF
  revisa:
    needs: prepara
    if: needs.prepara.outputs.normas != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        norma: ${{ fromJson(needs.prepara.outputs.normas) }}
    steps:
      - uses: actions/checkout@v5
      - name: Páginas contra el texto vigente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NORMA: ${{ matrix.norma }}
        run: python3 .github/motor/boe_revisor.py --norma="$NORMA"
