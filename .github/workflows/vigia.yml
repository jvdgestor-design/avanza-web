# Motor sin consumo (capa 0): vigila, mide, indexa y avisa sin IA. Escribe la cola en la rama datos-motor
# (motor/cola-trabajo.md). Cada hora: web viva. Cada día: fichas, presencia, caducados, sitemap, BOE,
# menciones e indexación por API (Bing, Search Console, Yandex: solo con sus secretos).
# A mano: gh workflow run vigia.yml -f piezas="fichas,presencia"   (vacío = las diarias)
# Si sale en rojo es que hay algo URGENTE (web caída) o una pieza rota: GitHub manda el correo.
name: Motor sin consumo
on:
  schedule:
    - cron: "23 4 * * *"   # diario: 05:23 en Madrid en invierno, 06:23 en verano (antes de la pasada de las 9:08)
    - cron: "7 * * * *"    # cada hora: web viva
  workflow_dispatch:
    inputs:
      piezas:
        description: "Piezas separadas por comas (fichas,presencia,caducados,sitemap,boe,menciones,indexacion,web). Vacío = las diarias"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/motor/vigia.py"
      - ".github/motor/indexa.py"
      - ".github/motor/tests/test_vigia.py"
      - ".github/workflows/vigia.yml"
permissions:
  contents: write   # solo para escribir en la rama datos-motor
  actions: read
  checks: read
concurrency:
  group: motor-sin-consumo
  cancel-in-progress: false
jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pruebas del motor
        run: python3 -B -m unittest discover -s .github/motor/tests -p "test_vigia.py"
      - name: Qué piezas tocan
        id: piezas
        env:
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          PEDIDAS: ${{ github.event.inputs.piezas }}
        run: |
          if [ "$EVENTO" = "push" ]; then P=""
          elif [ "$EVENTO" = "workflow_dispatch" ]; then P="${PEDIDAS:-fichas,presencia,caducados,sitemap,boe,menciones,indexacion,web}"
          elif [ "$CRON" = "7 * * * *" ]; then P="web"
          else P="fichas,presencia,caducados,sitemap,boe,menciones,indexacion,web"; fi
          echo "piezas=$P" >> "$GITHUB_OUTPUT"
          echo "Piezas: ${P:-ninguna (solo pruebas)}"
      - name: Rama datos-motor
        if: steps.piezas.outputs.piezas != ''
        run: |
          git config --global user.name "motor-sin-consumo"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin datos-motor:datos-motor 2>/dev/null; then
            git worktree add datos datos-motor
          else
            git worktree add --detach datos
            cd datos && git checkout --orphan datos-motor && git rm -rfq . && cd ..
          fi
          mkdir -p datos/motor
          for f in fichas.txt listados.txt ignorar.txt; do
            [ -f "datos/motor/$f" ] || cp ".github/motor/datos/$f" "datos/motor/$f"
          done
      - name: Dependencias de Search Console
        if: steps.piezas.outputs.piezas != '' && contains(steps.piezas.outputs.piezas, 'indexacion')
        env:
          GSC_KEY: ${{ secrets.GSC_KEY }}
        run: |
          if [ -n "$GSC_KEY" ]; then pip install --quiet google-auth requests; else echo "Sin GSC_KEY"; fi
      - name: Vigía
        id: vigia
        if: steps.piezas.outputs.piezas != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GSC_KEY: ${{ secrets.GSC_KEY }}
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          ALERTA_RSS: ${{ vars.ALERTA_RSS }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: python3 .github/motor/vigia.py --raiz . --datos datos/motor --piezas "${{ steps.piezas.outputs.piezas }}"
      - name: Guardar cola y estado
        if: always() && steps.piezas.outputs.piezas != ''
        run: |
          cd datos
          git add -A motor
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -qm "motor: $(date -u +%Y-%m-%dT%H:%MZ) ${{ steps.piezas.outputs.piezas }}"
          for i in 1 2 3; do git push -q origin datos-motor && exit 0; git pull -q --rebase origin datos-motor; done
          exit 1
