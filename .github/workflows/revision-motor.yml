# Revisión del motor (11/11/2026, decisión de Jose): cuando un PR de una rama claude/* cambia algo bajo .github/,
# otro modelo (Sonnet, por la API de Claude) intenta tumbarlo. El veredicto queda como estado del commit
# «revision-motor», que no se puede borrar: primero «pending» y luego «success» o «failure», con el enlace a esta
# ejecución. La fusión automática solo deja entrar un cambio del motor si todos los estados «revision-motor» de ese
# commit acaban en «success», cada uno apuntando a una ejecución de ESTE flujo (pull_request_target, a la primera)
# sobre ese mismo commit; un «failure», o un «pending» que no terminó, lo bloquean para siempre.
# Seguridad: con pull_request_target el flujo y el programa que revisa son SIEMPRE los de main; de la rama solo se
# lee el diff como dato y nunca se ejecuta nada suyo. Sin workflow_dispatch ni cancelaciones, a propósito.
name: Revisión del motor
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/**"
permissions:
  contents: read
  statuses: write
concurrency:
  group: revision-motor-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  revision:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CABEZA: ${{ github.event.pull_request.head.sha }}
      EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Estado «en revisión»
        run: >-
          gh api -X POST "repos/${{ github.repository }}/statuses/$CABEZA" -f state=pending -f context=revision-motor
          -f target_url="$EJECUCION" -f description="Sonnet revisando el motor" >/dev/null
      - name: Main (quien revisa)
        uses: actions/checkout@v5
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: false
      - name: Traer la rama como dato
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git -C main fetch -q origin "pull/$PR/head"
      - name: Revisión adversarial del motor
        id: revision
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ""
        run: python3 -I main/.github/motor/revisor_motor.py --repo main --base origin/main --cabeza "$CABEZA"
      - name: Estado final
        if: always()
        env:
          RESULTADO: ${{ steps.revision.outcome }}
        run: |
          if [ "$RESULTADO" = success ]; then estado=success; texto="Revisión del motor limpia"; else estado=failure; texto="Revisión del motor con reparos o fallida"; fi
          gh api -X POST "repos/${{ github.repository }}/statuses/$CABEZA" -f state="$estado" -f context=revision-motor \
            -f target_url="$EJECUCION" -f description="$texto" >/dev/null
          [ "$estado" = success ]
