# Tras cada publicación en main: pone en el sitemap la fecha real de cada página (lastmod = día en que su
# último cambio llegó a main) y, si cambia, la sube a main; espera a que la web sirva lo publicado (misma huella
# SHA-256), avisa a IndexNow con las páginas cambiadas o nuevas y repasa la salud en vivo. Sin usos de Claude.
# La subida del sitemap la hace el GITHUB_TOKEN: no vuelve a lanzar este flujo (GitHub no encadena flujos con él).
name: Después de publicar
on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
      - "llms.txt"
      - "robots.txt"
  workflow_dispatch:
permissions:
  contents: write   # solo para subir el sitemap con sus fechas
concurrency:
  group: publicacion
  cancel-in-progress: false
jobs:
  publicacion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fechas reales en el sitemap
        run: |
          python3 .github/motor/vigia.py --raiz . --reescribe-sitemap
          if git diff --quiet -- sitemap.xml; then exit 0; fi
          git diff --stat -- sitemap.xml
          git config user.name "motor-sin-consumo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "sitemap: lastmod con la fecha real de cada página" -- sitemap.xml
          for i in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            git pull -q --rebase origin main || { git rebase --abort; exit 1; }
            python3 .github/motor/vigia.py --raiz . --reescribe-sitemap
            git diff --quiet -- sitemap.xml || git commit -qm "sitemap: lastmod con la fecha real de cada página" -- sitemap.xml
          done
          exit 1
      - name: Huella en vivo e IndexNow
        env:
          ANTES: ${{ github.event.before }}
        run: python3 .github/motor/publicacion.py --antes "$ANTES"
      - name: Salud en vivo después de publicar
        if: always()
        run: python3 .github/motor/salud.py --vivo --espera 600
