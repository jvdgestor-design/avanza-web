# Tras cada publicación en main: espera a que la web sirva lo publicado (misma huella SHA-256),
# avisa a IndexNow con las páginas cambiadas o nuevas y repasa la salud en vivo. Sin usos de Claude.
name: Después de publicar
on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
      - "llms.txt"
      - "robots.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicacion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Huella en vivo e IndexNow
        env:
          ANTES: ${{ github.event.before }}
        run: python3 .github/motor/publicacion.py --antes "$ANTES"
      - name: Salud en vivo después de publicar
        if: always()
        run: python3 .github/motor/salud.py --vivo --espera 600
